name: Scheduled publish

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: curl -sf -X POST "$BUILD_HOOK_URL"
        env:
          BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
